# Marshell CI — Runs on every push and pull request
#
# SECURITY: ZERO environment variables or secrets required.

name: CI

on:
  push:
    branches: ["main", "develop"]
    paths-ignore:
      - "**.md"
      - "*.webp"
      - "*.svg"
      - ".github/assets/**"
  pull_request:
    branches: ["*"]
    paths-ignore:
      - "**.md"
      - "*.webp"
      - "*.svg"
      - ".github/assets/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome / Ultracite check
        run: pnpm check

      - name: Ensure no .env files committed
        run: |
          COMMITTED_ENV=$(git ls-files | grep -E '\.env$|\.env\.(local|dev|prod|staging|production|development)' || true)
          if [ -n "$COMMITTED_ENV" ]; then
            echo "ERROR: .env files found in git tracking:"
            echo "$COMMITTED_ENV"
            exit 1
          fi

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  rust:
    name: Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build frontend for Tauri
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Cargo check & test
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

  summary:
    name: CI Summary
    if: always()
    needs: [lint, typecheck, test, build, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Check job outcomes
        run: |
          echo "### CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- **lint**: ${{ needs.lint.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **typecheck**: ${{ needs.typecheck.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **test**: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **build**: ${{ needs.build.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **rust**: ${{ needs.rust.result }}" >> "$GITHUB_STEP_SUMMARY"
