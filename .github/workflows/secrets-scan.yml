name: Secrets Scan

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GL_VERSION="8.24.3"
          curl -sLO "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          tar -xzf "gitleaks_${GL_VERSION}_linux_x64.tar.gz" -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks detect --source . --no-git -v
