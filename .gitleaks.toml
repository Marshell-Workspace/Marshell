# Gitleaks configuration for Marshell
# https://github.com/gitleaks/gitleaks

title = "Marshell secret scanning config"

# Extend the default ruleset
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public property access in the verified Eruda 3.4.3 bundle"
condition = "AND"
paths = ['''^public/scripts/eruda\.js$''']
regexTarget = "match"
regexes = ['''^this\.accessGetter,r=this\.unenumerable;$''']
